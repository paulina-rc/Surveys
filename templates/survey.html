{% extends 'base.html' %}

{% block content %}

<h2>Responder encuesta</h2>

<form method="POST">

    {% for question in questions %}

    <h3>{{ question.question_text }}</h3>

    {% for option in question.options %}

    <input type="radio" name="question_{{ question.id }}" value="{{ option.id }}" required>

    {{ option.option_text }}

    <br>

    {% endfor %}

    <br>

    {% endfor %}

    <button type="submit">
        Enviar respuestas
    </button>

</form>

{% endblock %}
